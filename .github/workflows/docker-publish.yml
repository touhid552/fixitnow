name: Build & Push FixItNow to Docker Hub
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
 
jobs:
 
  # ── Job 1: Syntax check ────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
 
      - name: Install dependencies
        run: npm ci
 
      - name: Check syntax
        run: node --check app.js
 
  # ── Job 2: Build & push Docker image ──────────────────────────────────────
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fixitnow:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fixitnow:${{ github.sha }}
