name: Build & Push Docker Image

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  # Change this to your Docker Hub username/repo-name
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/fixitnow

jobs:
  # ─── Job 1: Run basic checks ────────────────────────────────────────────────
  test:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check Node.js syntax
        run: node --check app.js

  # ─── Job 2: Build & Push Docker image ───────────────────────────────────────
  docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: test                     # only runs if test job passes

    # Only push on pushes to main/master — not on pull requests
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Extract metadata for Docker tags & labels
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            # Tag with git short SHA  →  e.g.  yourname/fixitnow:abc1234
            type=sha,prefix=sha-,format=short
            # Tag with branch name   →  e.g.  yourname/fixitnow:main
            type=ref,event=branch
            # Tag as latest on main/master
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # Set up QEMU for multi-platform builds (linux/amd64 + linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub using secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the image and push to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs using GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print the image digest for traceability
      - name: Print image digest
        run: echo "Image pushed — digest ${{ steps.docker_build.outputs.digest }}"

  # ─── Job 3: Verify the pushed image pulls correctly ─────────────────────────
  verify:
    name: Verify Docker Image
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Pull and run the image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest
          docker run --rm -d --name fixitnow-test -p 3000:3000 ${{ env.IMAGE_NAME }}:latest
          sleep 5

      - name: Health check
        run: |
          curl --fail http://localhost:3000 || (docker logs fixitnow-test && exit 1)

      - name: Stop container
        run: docker stop fixitnow-test
