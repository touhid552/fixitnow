version: "3.9"

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: nginx_load_balancer
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - fixitnow_net
    restart: unless-stopped

  app1:
    image: YOUR_DOCKERHUB_USERNAME/fixitnow:latest
    container_name: fixitnow_app1
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - fixitnow_net
    restart: unless-stopped

  app2:
    image: YOUR_DOCKERHUB_USERNAME/fixitnow:latest
    container_name: fixitnow_app2
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - fixitnow_net
    restart: unless-stopped

  app3:
    image: YOUR_DOCKERHUB_USERNAME/fixitnow:latest
    container_name: fixitnow_app3
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - fixitnow_net
    restart: unless-stopped

networks:
  fixitnow_net:
    driver: bridge
